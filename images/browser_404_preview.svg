<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <!-- Window container -->
  <rect width="920" height="560" fill="rgb(15, 23, 42)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Browser Header -->
  <rect width="920" height="42" fill="rgb(30, 41, 59)" rx="10"/>
  <rect y="32" width="920" height="10" fill="rgb(30, 41, 59)"/>
  <circle cx="22" cy="21" r="6" fill="#ef4444"/>
  <circle cx="40" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="21" r="6" fill="#22c55e"/>

  <!-- Address Bar -->
  <rect x="180" y="8" width="560" height="26" rx="6" fill="rgb(15, 23, 42)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="200" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">http://128.199.200.100/invalid-path-demo</text>

  <!-- Error Card Container -->
  <g transform="translate(160, 75)">
    <rect width="600" height="440" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <!-- Top accent bar -->
    <rect width="600" height="4" rx="2" fill="url(#errorGradient)"/>
    <defs>
      <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ef4444"/>
        <stop offset="50%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
    </defs>

    <!-- 404 Large Number -->
    <text x="300" y="90" text-anchor="middle" fill="#ef4444" font-family="'Inter', sans-serif" font-size="68" font-weight="800">404</text>

    <!-- Badge -->
    <rect x="220" y="110" width="160" height="26" rx="13" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
    <circle cx="236" cy="123" r="4" fill="#ef4444"/>
    <text x="248" y="127" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">HTTP 404 NOT FOUND</text>

    <!-- Heading -->
    <text x="300" y="175" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="700">Trang Bạn Yêu Cầu Không Tồn Tại</text>

    <!-- Subtitle -->
    <text x="300" y="205" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">
      Đường dẫn tĩnh bạn truy cập đã bị thay đổi, bị xóa hoặc nhập sai cú pháp.
    </text>

    <!-- Details Box -->
    <g transform="translate(60, 235)">
      <rect width="480" height="90" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="20" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Trạng thái phản hồi:</text>
      <text x="460" y="28" text-anchor="end" fill="#ef4444" font-family="'Consolas', monospace" font-size="12" font-weight="600">404 Not Found</text>

      <line x1="20" y1="42" x2="460" y2="42" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

      <!-- Row 2 -->
      <text x="20" y="60" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Xử lý bởi:</text>
      <text x="460" y="60" text-anchor="end" fill="#38bdf8" font-family="'Consolas', monospace" font-size="12">Nginx Custom Error Page</text>

      <line x1="20" y1="72" x2="460" y2="72" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

      <!-- Row 3 -->
      <text x="20" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Quyền truy cập trực tiếp:</text>
      <text x="460" y="85" text-anchor="end" fill="#22c55e" font-family="'Consolas', monospace" font-size="12">Internal Only (Protected)</text>
    </g>

    <!-- Button -->
    <rect x="230" y="345" width="140" height="34" rx="8" fill="#ef4444"/>
    <text x="300" y="367" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Trở Về Trang Chủ</text>

    <!-- Footer -->
    <text x="300" y="415" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">
      PTIT DevOps Course - Session 03
    </text>
  </g>
</svg>
