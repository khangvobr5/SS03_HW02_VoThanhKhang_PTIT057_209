<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="920" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="300" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: devops@ubuntu-devops-server — Nginx Custom 404</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Command 1: Nginx -t -->
    <text x="24" y="66" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="66" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="66" fill="rgb(56, 189, 248)">sudo nginx -t</text>
    <text x="24" y="90" fill="rgb(203, 213, 225)">nginx: the configuration file /etc/nginx/nginx.conf syntax is ok</text>
    <text x="24" y="110" fill="rgb(34, 197, 94)">nginx: configuration file /etc/nginx/nginx.conf test is successful</text>

    <!-- Command 2: Reload -->
    <text x="24" y="142" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="142" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="142" fill="rgb(56, 189, 248)">sudo systemctl reload nginx</text>

    <!-- Command 3: curl invalid path -->
    <text x="24" y="180" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="180" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="180" fill="rgb(56, 189, 248)">curl -I http://localhost/invalid-path-demo</text>
    <text x="24" y="206" fill="rgb(239, 68, 68)" font-weight="bold">HTTP/1.1 404 Not Found</text>
    <text x="24" y="226" fill="rgb(203, 213, 225)">Server: nginx/1.18.0 (Ubuntu)</text>
    <text x="24" y="246" fill="rgb(203, 213, 225)">Content-Type: text/html</text>
    <text x="24" y="266" fill="rgb(203, 213, 225)">Content-Length: 4210</text>
    <text x="24" y="286" fill="rgb(203, 213, 225)">Connection: keep-alive</text>

    <!-- Command 4: curl direct 404.html -->
    <text x="24" y="324" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="324" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="324" fill="rgb(56, 189, 248)">curl -I http://localhost/404.html</text>
    <text x="24" y="350" fill="rgb(239, 68, 68)" font-weight="bold">HTTP/1.1 404 Not Found</text>
    <text x="24" y="370" fill="rgb(203, 213, 225)">Server: nginx/1.18.0 (Ubuntu)</text>
    <text x="24" y="390" fill="rgb(203, 213, 225)">Content-Type: text/html</text>
    <text x="24" y="410" fill="rgb(203, 213, 225)">Content-Length: 4210</text>
    <text x="24" y="430" fill="rgb(203, 213, 225)">Connection: keep-alive</text>

    <text x="24" y="470" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="470" fill="rgb(248, 250, 252)">:~$ </text>
  </g>
</svg>
